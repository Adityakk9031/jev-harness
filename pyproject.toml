[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jev-harness-sdk"
version = "1.2.0"
description = "Test your AI coding-agent setup the way you test your code: guards, gates, compaction survival, reviewers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Kumar Singh" }]
keywords = ["ai-agents", "evals", "claude-code", "codex", "guardrails", "calibration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

# Core runtime dependencies. Kept deliberately small and pure-Python so that
# `guard` and `calibrate` need no model SDK and no scientific stack (PLAN D2).
# `unidiff` and `bashlex` are module-specific but pure-Python and tiny; the
# extras list is fixed by the brief (anthropic/openai/stats/all), so they live
# here rather than in an extra. See docs/PLAN.md section 7.
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "bashlex>=0.18",
  "unidiff>=0.7.5",
]

# The extra names are fixed by the brief. `all` repeats the members rather
# than self-referencing, because a self-referential extra is not build-safe.
# (Keep these in sync with the individual extras above.)
[project.optional-dependencies]
anthropic = ["anthropic>=0.34"]
openai = ["openai>=1.40"]
stats = ["numpy>=1.26", "scipy>=1.11"]
all = ["anthropic>=0.34", "openai>=1.40", "numpy>=1.26", "scipy>=1.11"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "syrupy>=4.6",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0",
]

[project.scripts]
jev-harness = "jev_harness.cli:main"

[project.urls]
Homepage = "https://github.com/Adityakk9031/jev-harness"
Issues = "https://github.com/Adityakk9031/jev-harness/issues"
Changelog = "https://github.com/Adityakk9031/jev-harness/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_harness"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "CLAUDE.md", "README.md"]

# ---------------------------------------------------------------- lint / types

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["action"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "F",      # pyflakes
  "W",      # pycodestyle warnings
  "I",      # isort
  "N",      # pep8-naming
  "UP",     # pyupgrade
  "B",      # bugbear
  "A",      # builtins shadowing
  "C4",     # comprehensions
  "PT",     # pytest style
  "RUF",    # ruff-specific
  "SIM",    # simplify
  "ASYNC",  # async correctness
  "T20",    # no print
  "PTH",    # pathlib
  "DTZ",    # timezone-aware datetimes
  "EM",     # exception messages
  "TRY",    # exception handling
  "RET",    # return statements
  "S",      # bandit-style security
  "PERF",   # performance
]
# Long, multi-line error messages are the house style for validation errors.
ignore = ["TRY003", "EM101", "EM102"]

[tool.ruff.lint.flake8-builtins]
# Trace.slice() is the name the public API specifies (brief section 5).
builtins-ignorelist = ["slice"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109", "ASYNC221", "E501", "S101", "S105", "S106", "S108", "S603", "S607", "ARG001", "PTH123", "PLR2004"]
"tests/fixtures/**" = ["T201", "S101"]
"demo/**" = ["T201"]
# Subprocess use is deliberate and audited in these places: agent runners, the git calls that
# make a worktree, and the contextleleo bridge. Each calls a fixed argv list built from
# validated arguments, never a shell string.
"src/jev_harness/core/runner.py" = ["S603", "S607"]
"src/jev_harness/core/workspace.py" = ["S603", "S607"]
"src/jev_harness/core/importers/contextleleo.py" = ["S603", "S607"]
"src/jev_harness/modules/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["jev_harness"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/jev_harness"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
check_untyped_defs = true

# Strict typing is required only for the core package (brief section 5).
[[tool.mypy.overrides]]
module = "jev_harness.core.*"
strict = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "jev_harness.cli"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scipy.*", "bashlex.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# -------------------------------------------------------------------- testing

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Lets tests import shared helpers as `tests.conftest` without making tests/ a package.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not live' --strict-markers --strict-config -ra"
markers = [
  "live: needs real API keys, real agent CLIs, or network access (skipped by default)",
]
